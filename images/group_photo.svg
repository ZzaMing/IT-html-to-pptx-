      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="badgeGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172f62"/>
