  <line x1="375" y1="208" x2="425" y2="208" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="375" y1="218" x2="415" y2="218" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="420" cy="225" r="6" fill="#f59e0b"/>

