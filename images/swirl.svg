<svg viewBox="0 0 400 400" width="380" height="380">
  <defs>
    <filter id="swirlShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background outer dashed orbit circle (Ref Image 1) -->
  <circle cx="200" cy="200" r="185" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.8" />

  <!-- 3 Interlocking Swirling Petals (Ref Image 2: HTML, CSS, JS) -->
  <g filter="url(#swirlShadow)">
    <path d="M 200 200 A 75 75 0 0 0 135.05 162.5 A 75 75 0 1 1 200 200 Z" fill="#1a56db" stroke="#ffffff" stroke-width="3.5" transform="rotate(0 200 200)" />
    <text x="200.0" y="121.0" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff" font-family="Pretendard, sans-serif" letter-spacing="0.05em">HTML</text>
    <text x="200.0" y="140.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" opacity="0.9" font-family="Pretendard, sans-serif">웹 구조</text>
  </g>
  <g filter="url(#swirlShadow)">
    <path d="M 200 200 A 75 75 0 0 0 135.05 162.5 A 75 75 0 1 1 200 200 Z" fill="#0ea5e9" stroke="#ffffff" stroke-width="3.5" transform="rotate(120 200 200)" />
    <text x="265.0" y="233.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff" font-family="Pretendard, sans-serif" letter-spacing="0.05em">CSS</text>
    <text x="265.0" y="252.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" opacity="0.9" font-family="Pretendard, sans-serif">스타일</text>
  </g>
  <g filter="url(#swirlShadow)">
    <path d="M 200 200 A 75 75 0 0 0 135.05 162.5 A 75 75 0 1 1 200 200 Z" fill="#0f2b82" stroke="#ffffff" stroke-width="3.5" transform="rotate(240 200 200)" />
    <text x="135.0" y="233.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff" font-family="Pretendard, sans-serif" letter-spacing="0.05em">JS</text>
    <text x="135.0" y="252.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff" opacity="0.9" font-family="Pretendard, sans-serif">동적 제어</text>
  </g>
  <circle cx="200" cy="200" r="22" fill="#ffffff" stroke="#1a56db" stroke-width="3" />
  <circle cx="200" cy="200" r="8" fill="#1a56db" />
</svg>